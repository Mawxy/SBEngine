<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spectacular Bid Engine</title>
<meta name="description" content="Live analysis board for Spectacular Bid dominoes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,700;1,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: a racing-silks scoreboard on top, the felt table and your rack on the left,
   the engine's read and the hand log on the right; stacks to one column on phones. */
:root {
  --bg: #eef0f4;
  --ink: #142039;
  --muted: #5b6680;
  --panel: #ffffff;
  --panel-2: #f6f7fa;
  --line: #d5dae4;
  --seat1: #1f3a68;          /* blue chips */
  --seat2: #b3262e;          /* red chips */
  --seat1-soft: #dfe7f5;
  --seat2-soft: #f7e0e1;
  --felt: #18304f;
  --felt-2: #22436b;
  --felt-ink: #dfe8f5;
  --felt-muted: #9fb4cf;
  --ivory: #f8f4e9;
  --ivory-edge: #bdb39a;
  --pip: #171717;
  --good: #22744a;
  --good-soft: #dcefe4;
  --bad: #a3323a;
  --focus: #e0a526;
  --f-display: "Bitter", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1220; --ink: #e4e8f1; --muted: #93a0b9; --panel: #141d30; --panel-2: #19243a; --line: #273450;
    --seat1: #86a8e6; --seat2: #ee7a7f; --seat1-soft: #1c2d4d; --seat2-soft: #3a1d24;
    --felt: #0e1c31; --felt-2: #17304f; --felt-ink: #dfe8f5; --felt-muted: #8ea4c2;
    --good: #5cc48a; --good-soft: #163526; --bad: #ef7d84; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1220; --ink: #e4e8f1; --muted: #93a0b9; --panel: #141d30; --panel-2: #19243a; --line: #273450;
  --seat1: #86a8e6; --seat2: #ee7a7f; --seat1-soft: #1c2d4d; --seat2-soft: #3a1d24;
  --felt: #0e1c31; --felt-2: #17304f; --felt-ink: #dfe8f5; --felt-muted: #8ea4c2;
  --good: #5cc48a; --good-soft: #163526; --bad: #ef7d84; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 40px;
  display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) 340px;
  grid-template-areas: "top top" "main side";
}
@media (max-width: 920px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main" "side"; }
}
@media (max-width: 520px) {
  .seats { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
  .chips { grid-template-columns: repeat(10, 6px); }
  .chips i { width: 6px; height: 6px; }
  .board { min-height: 200px; }
}
.top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.main { grid-area: main; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.side { grid-area: side; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* Brand */
.brand { display: flex; align-items: baseline; gap: 6px; margin-right: auto; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.55rem; letter-spacing: -0.01em; color: var(--seat1); }
.brand h1 em { font-style: italic; font-weight: 600; color: var(--seat2); }
.brand .tag { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* Seat cards with chip pools */
.seats { display: flex; flex-wrap: wrap; gap: 10px; }
.seat { display: grid; gap: 4px; padding: 8px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.seat.to-move { box-shadow: inset 0 0 0 2px var(--c); }
.seat .who { display: flex; align-items: baseline; gap: 8px; font-size: 0.82rem; color: var(--muted); }
.seat .who b { color: var(--c); font-weight: 600; font-size: 0.95rem; }
.seat .pool { display: flex; align-items: center; gap: 8px; }
.seat .pool .n { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; color: var(--ink); min-width: 2ch; text-align: right; }
.chips { display: grid; grid-template-columns: repeat(15, 7px); gap: 2px; }
.chips i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chips i.gone { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; background: var(--c-soft); color: var(--c); }
.meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 0.85rem; }
.meta b { color: var(--ink); font-weight: 600; }

/* Board */
.board { position: relative; border-radius: 14px; align-content: center; background: radial-gradient(120% 90% at 50% 40%, var(--felt-2), var(--felt)); color: var(--felt-ink); padding: 44px 12px 14px; min-height: 280px; display: grid; }
.board-hud { position: absolute; inset: 10px 14px auto; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.82rem; color: var(--felt-muted); pointer-events: none; }
.board-hud b { color: var(--felt-ink); font-weight: 600; }
.board-hud .count b { font-family: var(--f-display); font-size: 1.05rem; }
.board-hud .scores { color: #f2c75c; font-weight: 600; }
.board-scroll { overflow-x: auto; display: grid; place-items: center; min-width: 0; }
.board svg { display: block; max-height: 62vh; }
.tile-face { fill: var(--ivory); stroke: var(--ivory-edge); stroke-width: 1; }
.tile-div { stroke: var(--ivory-edge); stroke-width: 1.2; }
.pip { fill: var(--pip); }
.tile.last .tile-face { stroke: #f2c75c; stroke-width: 2.5; }
.slot rect { fill: rgba(255,255,255,0.04); stroke: rgba(223,232,245,0.35); stroke-dasharray: 4 4; }
.slot text { fill: var(--felt-muted); font-family: var(--f-mono); font-size: 12px; text-anchor: middle; dominant-baseline: central; }
.slot.live { cursor: pointer; }
.slot.live rect { fill: rgba(242,199,92,0.18); stroke: #f2c75c; stroke-dasharray: none; stroke-width: 2; }
.slot.live text { fill: #f8e3a8; font-weight: 500; }
.slot.live:hover rect, .slot.live:focus rect { fill: rgba(242,199,92,0.32); }

/* Chess-style eval bar: Seat 1 (blue) fills from the bottom, Seat 2 (red) from the top */
.board-row { display: flex; gap: 10px; align-items: stretch; min-width: 0; }
.board-row .board { flex: 1; min-width: 0; }
.vbar { position: relative; width: 34px; flex: none; border-radius: 8px; overflow: hidden; background: var(--seat2); border: 1px solid var(--line); }
.vbar-fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--seat1); transition: height .35s ease; }
.vbar-num { position: absolute; left: 0; right: 0; text-align: center; font-size: 0.64rem; letter-spacing: -0.02em; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--panel); }
.vbar.s1 .vbar-num { bottom: 6px; } .vbar.s2 .vbar-num { top: 6px; }
@media (prefers-reduced-motion: reduce) { .vbar-fill { transition: none; } }

/* Rack */
.rack-wrap { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 16px; }
.rack { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
.rack button { background: none; border: 0; padding: 0; border-radius: 7px; transition: transform .12s ease; }
.rack button svg { width: 40px; height: 80px; display: block; }
.rack button.legal { transform: translateY(-6px); }
.rack button.legal .tile-face { stroke: var(--seat1); stroke-width: 2; }
.rack button.dim { opacity: 0.45; }
.rack button.pending .tile-face { stroke: #e0a526; stroke-width: 3; }
.rack-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.rack-label b { color: var(--ink); text-transform: none; letter-spacing: 0; font-weight: 600; }

/* Panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.08rem; text-wrap: balance; }
.panel h2 small { font-family: var(--f-body); font-weight: 400; font-size: 0.85rem; color: var(--muted); margin-left: 6px; }
.panel p { margin: 0; color: var(--muted); max-width: 62ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--seat1); border-color: var(--seat1); color: var(--panel); }
.btn.red { background: var(--seat2); border-color: var(--seat2); color: var(--panel); }
.btn.on { box-shadow: inset 0 0 0 2px var(--seat1); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.small { padding: 4px 9px; font-size: 0.85rem; }
.notice { padding: 8px 12px; border-radius: 8px; background: var(--seat2-soft); color: var(--ink); font-size: 0.9rem; }
.notice.info { background: var(--seat1-soft); }
.notation { display: flex; gap: 8px; }
.notation input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-family: var(--f-mono); }
.hint { font-size: 0.8rem; color: var(--muted); }
.hint code, .mono-chip { font-family: var(--f-mono); font-size: 0.85em; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }

/* Tile picker: the double-six set laid out by high end */
.picker { display: grid; gap: 6px; overflow-x: auto; }
.picker .prow { display: flex; gap: 6px; }
.picker button { background: none; border: 0; padding: 2px; border-radius: 6px; position: relative; }
.picker button svg { width: 52px; height: 26px; display: block; }
.picker button.sel { background: var(--seat1); }
.picker button.sel .tile-face { stroke: var(--seat1); }
.picker button.fits { background: var(--good-soft); }
.picker button.excl svg { opacity: 0.5; }
.picker button.excl::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; border-top: 2px solid var(--bad); transform: rotate(-12deg); }
.picker button:disabled { opacity: 0.18; cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Bidding */
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--panel-2); width: 34px; height: 34px; font-size: 1.1rem; }
.stepper output { min-width: 3ch; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }

/* Engine */
.evalhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.evalnum { font-family: var(--f-display); font-weight: 700; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.evalnum.small { font-size: 1.1rem; }
.evalbar + .evalscale + .evalbar { margin-top: 4px; }
.evalbar { position: relative; height: 10px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.evalbar span { position: absolute; top: 0; bottom: 0; }
.evalbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; border-left: 1px solid var(--muted); }
.evalscale { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.moves { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.moves td { padding: 5px 4px; border-top: 1px solid var(--line); }
.moves tr:first-child td { border-top: 0; }
.moves td.n { font-family: var(--f-mono); font-weight: 500; }
.moves td.v { text-align: right; width: 6ch; }
.moves td.se { text-align: right; color: var(--muted); font-size: 0.8rem; width: 6ch; }
.moves td.bar { width: 40%; }
.moves td.bar span { display: block; height: 6px; border-radius: 3px; background: var(--seat1); opacity: 0.75; }
.moves tr.best td.n { color: var(--good); }
.moves tr.click { cursor: pointer; }
.moves tr.click:hover td { background: var(--panel-2); }
.levels { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.levels button { border: 0; background: transparent; padding: 4px 10px; font-size: 0.82rem; }
.levels button.on { background: var(--seat1); color: var(--panel); }
.stats { font-size: 0.76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.thinking { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); }
.thinking i { width: 8px; height: 8px; border-radius: 50%; background: var(--seat1); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .thinking i { animation: none; } .rack button { transition: none; } }

/* History */
.hand-log { display: grid; gap: 4px; }
.hand-log h3 { margin: 6px 0 0; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.mv { display: flex; flex-wrap: wrap; gap: 4px; }
.mv span { font-family: var(--f-mono); font-size: 0.82rem; padding: 1px 6px; border-radius: 5px; border-left: 3px solid var(--c); background: var(--panel-2); }
.mv span em { font-style: normal; color: var(--good); font-weight: 500; margin-left: 3px; }
.endline { font-size: 0.82rem; color: var(--muted); }
.arena-rack { display: grid; gap: 6px; }
.arena-rack .rtile svg { width: 34px; height: 68px; display: block; }
h3.sub { margin: 4px 0 0; font-size: 0.95rem; }
.choice { display: grid; gap: 8px; padding: 12px; border-radius: 10px; background: var(--panel-2); }
.choice h3 { margin: 0; font-size: 0.98rem; font-weight: 600; }
.reveal { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.reveal svg { width: 44px; height: 22px; }
/* Hand outcome odds */
.handodds { display: grid; gap: 4px; }
.oddsbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--line); }
.oddsbar span { display: block; height: 100%; }
.oddsbar span.lite { opacity: 0.45; }
.oddsline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 0.78rem; color: var(--muted); }
.oddsline b { font-weight: 600; }
.moves th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; text-align: left; padding: 0 4px 4px; }
.moves th.v { text-align: right; }
.moves td.o { text-align: right; color: var(--muted); font-size: 0.8rem; width: 5ch; }

.gameodds { display: grid; gap: 3px; }
.gamebar { height: 12px; border-radius: 6px; overflow: hidden; background: var(--seat2); }
.gamebar span { display: block; height: 100%; background: var(--seat1); }
.gameline { display: flex; justify-content: space-between; gap: 8px; font-size: 0.85rem; }
.gameline b { font-family: var(--f-display); font-size: 1.05rem; }
.moves td.g, .moves td.o.g { font-weight: 600; color: var(--ink); }

/* Replay */
.rp-nav .btn { min-width: 44px; }
.pts { color: var(--good); font-weight: 600; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.cards.stack { grid-template-columns: minmax(0, 1fr); }
.card { display: grid; gap: 6px; padding: 10px; border-radius: 10px; background: var(--panel-2); align-content: start; }
.card h3 { margin: 0; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.verdict { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 8px 12px; border-radius: 8px; background: var(--panel-2); border-left: 4px solid var(--muted); }
.verdict b { font-weight: 600; }
.verdict.v-best, .verdict.v-good { border-left-color: var(--good); }
.verdict.v-inacc { border-left-color: #d1a12a; }
.verdict.v-mistake { border-left-color: #d5762f; }
.verdict.v-blunder { border-left-color: var(--bad); }
.moves.rp tr.played td { background: var(--seat1-soft); }
.moves .tag { font-family: var(--f-body); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.graph { display: grid; gap: 2px; }
.graph svg { width: 100%; height: 110px; display: block; border-radius: 8px; border: 1px solid var(--line); }
.g-s1 { fill: var(--seat1-soft); } .g-s2 { fill: var(--seat2-soft); }
.g-mid { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
.g-sep { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.g-lbl { font-size: 10px; fill: var(--muted); }
.g-line { fill: none; stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.g-dot { fill: var(--ink); }
.g-cur { stroke: var(--focus); stroke-width: 2; vector-effect: non-scaling-stroke; }
.g-hit { fill: transparent; cursor: pointer; }
.g-hit:hover { fill: rgba(127,127,127,0.12); }
.g-mistake { fill: #d5762f; } .g-blunder { fill: var(--bad); }
.mv span.go { cursor: pointer; }
.mv span.go:hover { background: var(--line); }
.mv span.cur { box-shadow: inset 0 0 0 2px var(--focus); }
.mv span i.gd { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-left: 4px; vertical-align: 1px; }
.gd.inacc { background: #d1a12a; } .gd.mistake { background: #d5762f; } .gd.blunder { background: var(--bad); }
.arena-rack .rtile.next .tile-face { stroke: var(--focus); stroke-width: 3; }
textarea.loadbox { width: 100%; min-height: 110px; font-family: var(--f-mono); font-size: 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); padding: 8px; }
textarea.record { width: 100%; min-height: 140px; font-family: var(--f-mono); font-size: 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); padding: 8px; }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1>Spectacular <em>Bid</em></h1><span class="tag">Engine</span></div>
    <div class="seats" id="seats"></div>
    <div class="meta" id="meta"></div>
  </header>
  <section class="main">
    <div class="board-row">
      <div class="vbar" id="vbar" hidden role="img" aria-label="Evaluation bar"><div class="vbar-fill" id="vbar-fill"></div><span class="vbar-num" id="vbar-num"></span></div>
      <div class="board" id="board"><div class="board-hud" id="hud"></div><div class="board-scroll" id="boardsvg"></div></div>
    </div>
    <div class="rack-wrap" id="rackwrap"></div>
    <div class="panel" id="actions"></div>
  </section>
  <aside class="side">
    <div class="panel" id="engine"></div>
    <div class="panel" id="history"></div>
  </aside>
</div>

<script id="havi-pack" type="text/plain">
const AdapterOld = (function () {
// Plays HaviEngine's live "Experimental" bot (MCTS v2) from a Spectacular Bid session state.
// Shared by the GUI's worker and the Node arena runner. No DOM, no imports:
// pass in the bundled HaviEngine module object (H) and a session state JSON for the bot's seat.
//
// Faithful to how HaviEngine plays in its GameRoom:
//   - one determinization of the hidden tiles per decision, MCTS with C = sqrt(2),
//     DEFAULT_WEIGHTS, 1000 ms limit, SPRT early stop
//   - bidding through its MCTS bidding tree
//   - free lead after winning the bid: the first tile in its hand (deal order), modeled as a random tile
// The referee is our engine (rules from engine-rules-spec.md), so forced leads come from our rules.

function haviTile(code) {
  const hi = +code[0], lo = +code[1];
  return { top: lo, bottom: hi, id: `${lo}-${hi}` };
}

function haviPiece(p) {
  const hi = +p.t[0], lo = +p.t[1];
  return { top: p.in, bottom: p.out, id: `${lo}-${hi}` };
}

// Our layout (center/spinner + arms in attachment order) -> HaviEngine boardState + boardEnds.
// Arm 0 = left, 1 = right, 2 = up, 3 = down.
function haviBoard(L) {
  const bs = { spinner: null, spinnerReady: false, firstTile: null, leftArm: [], rightArm: [], upArm: [], downArm: [] };
  const ends = [null, null, null, null];
  if (!L.center && !L.spinner) return { bs, ends };
  const arms = L.arms.map((a) => a.map(haviPiece));
  bs.leftArm = arms[0] || []; bs.rightArm = arms[1] || []; bs.upArm = arms[2] || []; bs.downArm = arms[3] || [];

// ------------------------------------------------------------ engine glue
async function makeEngine(mod) {
  let inst;
  const mem = () => new DataView(inst.exports.memory.buffer);
  const wasi = {
    fd_write: (fd, iovs, n, nw) => { mem().setUint32(nw, 0, true); return 0; },
    fd_close: () => 0, fd_seek: () => 0, fd_fdstat_get: () => 8,
    fd_prestat_get: () => 8, fd_prestat_dir_name: () => 8,
    proc_exit: (c) => { throw new Error("engine exited " + c); },
    environ_sizes_get: (a, b) => { mem().setUint32(a, 0, true); mem().setUint32(b, 0, true); return 0; },
    environ_get: () => 0,
  };
  const imports = { wasi_snapshot_preview1: new Proxy(wasi, { get: (t, k) => (k in t ? t[k] : () => 52) }) };
  inst = await WebAssembly.instantiate(mod, imports);
  if (inst.exports._initialize) inst.exports._initialize();
  const enc = new TextEncoder(), dec = new TextDecoder();
  return {
    cmd(s) {
      const b = enc.encode(s + "\0");
      const p = inst.exports.sb_alloc(b.length);
      new Uint8Array(inst.exports.memory.buffer, p, b.length).set(b);
      const r = inst.exports.sb_command(p);
      inst.exports.sb_free(p);
      const u = new Uint8Array(inst.exports.memory.buffer);
      let e = r; while (u[e]) e++;
      return JSON.parse(dec.decode(u.subarray(r, e)));
    },
  };
}

const HAVI_PACK = document.getElementById("havi-pack").textContent;
const WORKER_SRC = `
${makeEngine.toString()}
${HAVI_PACK}
// current: HaviEngine 5d092f9 (2026-10-12). shipped / fixed: the older 3a45a1c bot.
const HAVI = { current: [HaviCurrent, AdapterNew], shipped: [HaviShipped, AdapterOld], fixed: [HaviFixed, AdapterOld] };
AdapterNew.haviInit(HaviCurrent);  // match equity table: the baseline its GameRoom falls back to
function haviChoose(v, st, opts) { const [H, A] = HAVI[v] || HAVI.current; return A.haviChoose(H, st, opts); }
let modReady;
onmessage = async (e) => {
  const m = e.data;
  if (m.type === "init") { modReady = WebAssembly.compile(m.bytes); await modReady; return; }
  if (m.type === "run") {
    const mod = await modReady;
    for (let i = 0; i < m.cmds.length; i++) {
      const eng = await makeEngine(mod);
      for (const c of m.log) eng.cmd(c);
      const t0 = performance.now();
      const r = eng.cmd(m.cmds[i]);
      r.ms = Math.round(performance.now() - t0);
      postMessage({ type: "result", id: m.id, final: i === m.cmds.length - 1, r });
    }
  }
  if (m.type === "havi") {
    const mod = await modReady;
    const eng = await makeEngine(mod);
    for (const c of m.log) eng.cmd(c);
    const t0 = performance.now();
    const move = haviChoose(m.version, eng.cmd("state " + m.seat), { limitMs: m.limitMs });
    postMessage({ type: "result", id: m.id, final: true, r: { ok: true, move, ms: Math.round(performance.now() - t0) } });
  }
  if (m.type === "series") {
    const mod = await modReady;
    for (let g = 0; g < m.games; g++) {
      const eng = await makeEngine(mod);
      const ourSeat = g % 2 === 0 ? 1 : 2;
      let S = eng.cmd("arena " + (m.seed + g)), start = [30, 30], nets = [], moves = 0;
      const clog = ["arena " + (m.seed + g)];
      const net = () => (S.pools[ourSeat - 1] - start[ourSeat - 1]) - (S.pools[2 - ourSeat] - start[2 - ourSeat]);
      while (S.phase !== "gameover") {
        if (S.phase === "handover") { nets.push(net()); start = S.pools.slice(); S = eng.cmd("next"); clog.push("next"); continue; }
        const who = S.toMove;
        const choice = "botchoice " + m.dets + " " + m.nodes + " " + (g * 1000 + moves);
        let mv;
        if (who !== ourSeat) mv = haviChoose(m.version, eng.cmd("state " + who), { limitMs: m.limitMs });
        else if (m.api) {
          // Desktop app: the native engine with the trained models plays our side.
          let r;
          try { r = await (await fetch(m.api, { method: "POST", body: [choice, ...clog].join(String.fromCharCode(10)) })).json(); }
          catch (err) { postMessage({ type: "series", id: m.id, error: "Lost contact with the engine. Restart the app." }); return; }
          if (!r.ok) { postMessage({ type: "series", id: m.id, error: r.error || "engine error" }); return; }
          mv = r.move;
        } else mv = eng.cmd(choice).move;
        const n = eng.cmd("move " + mv);
        clog.push("move " + mv);
        if (!n.ok) { postMessage({ type: "series", id: m.id, error: "Seat " + who + " made an illegal move: " + mv }); return; }
        S = n; moves++;
      }
      nets.push(net());
      postMessage({ type: "series", id: m.id, game: { n: g + 1, ourSeat, won: S.winner === ourSeat, hands: S.handNumber, pools: S.pools, nets } });
    }
    postMessage({ type: "series", id: m.id, done: true });
  }
};`;
